# Book-level settings. Authored configuration.
title: NFL Game Day Recipe Booklet
subtitle: Regional game-day food from all 32 teams
output_filename: nfl-game-day-recipe-booklet.pdf
paper: letter
# Apps Script web app that files anonymous website suggestions as GitHub issues
# (docs/website-suggestions.md). Leave empty to show only the GitHub links.
suggestion_form_url: https://script.google.com/macros/s/AKfycbzqOSEWVBAJrP1iYV0d3pNJzgIdWUlgKUjvZVBBMMNXdGWsLGHKXIsGW223rdguKo9aTA/exec
# Recipe photos per output: a centred square crop, resized (never enlarged),
# recompressed and stripped of metadata. Source photos in recipes/ stay untouched.
# web: 190 px photo box at 2x density. print: 1.67 in box at 300 dpi (pdflatex
# cannot embed WebP, so print stays JPEG).
photos:
  web: { format: webp, size: 400, quality: 80 }
  print: { format: jpeg, size: 500, quality: 82 }
# Published website root. Each PDF recipe and component page links to its page
# here (recipe-<id>.html / component-<id>.html). Leave empty to omit the links.
website_url: https://michaeld3289.github.io/nfl-game-day-cookbook/

# Separate portrait recipe cards; long recipes continue onto additional cards.
cards:
  width_inches: 4
  height_inches: 6
  output_filename: nfl-game-day-recipe-cards.pdf
  max_pages: 4
