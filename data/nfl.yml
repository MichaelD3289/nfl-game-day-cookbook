# Canonical NFL structure. Authored data: edit by hand, never generated.
#
# Publication order in the book follows list order at every level
# (conference -> division -> team). A recipe's team is inferred from its path:
#   recipes/<conference id>/<division id>/<team slug>/<recipe id>.md
#
# Slugs are stable identifiers used in paths and cross-reference labels.
# Do not rename a slug without moving the matching recipe directory.
