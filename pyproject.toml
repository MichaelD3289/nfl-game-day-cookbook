[project]
name = "nfl-game-day-cookbook"
version = "0.3.1"
description = "Book-as-code publishing system for the NFL Game Day recipe booklet."
readme = "README.md"
authors = [
    { name = "Michael Drummond", email = "97915761+MichaelD3289@users.noreply.github.com" }
]
requires-python = ">=3.11"
keywords = [
    "nfl",
    "football",
    "game-day",
    "recipes",
    "cookbook",
    "book-as-code",
    "publishing",
    "quarto",
    "latex",
    "jinja2",
    "pdf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "qrcode[pil]>=8.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
nfl-book = "nfl_book.cli:app"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nfl_book"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["nfl_book"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["frontmatter", "frontmatter.*", "qrcode", "qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "pdf: requires Quarto + TinyTeX; skipped automatically when unavailable",
]

[tool.coverage.run]
source = ["nfl_book"]
