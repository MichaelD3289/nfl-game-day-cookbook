# Build PDF, HTML and EPUB after automated tagging; deploy every website version to Pages,
# with the newest stable release at the root and each release under /vX.Y.Z/.
# Run it manually from the Actions tab with an existing tag to (re)build that version,
# including tags created before this workflow existed.
# Runs offline apart from tool setup: short links come from the committed
# data/shortlinks.yml, so this never runs `make links`.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag created by the main workflow
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish, e.g. v0.2.0
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

# One publisher at a time; a fresh eligibility check also protects against old tags.
concurrency:
  group: cookbook-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAG: ${{ inputs.tag }}
      # Must match nfl_book.publishing.EPUB_FILENAME (tests/unit/test_epub.py checks it).
      EPUB: dist/nfl-game-day-cookbook.epub
      PDF: dist/nfl-game-day-recipe-booklet.pdf
      WEBSITE: dist/nfl-game-day-website.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Verify release tag is on main
        run: |
          if ! tag_commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"; then
            echo "::error::Release requires an existing version tag: $TAG"
            exit 1
          fi
          if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Checked-out commit does not match tag $TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::Tag $TAG is not on main. Merge the release commit into main before tagging."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: quarto-dev/quarto-actions/setup@v2
        env:
          # Quarto reads GH_TOKEN when looking up the latest TinyTeX release.
          GH_TOKEN: ${{ github.token }}
        with:
          version: 1.10.18
          tinytex: true

      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Check
        run: make check

      - name: Build PDF
        run: make pdf

      - name: Build website
        run: make website

      - name: Build EPUB
        run: make epub

      - name: Package downloadable website
        run: |
          rm -f "$WEBSITE"
          (cd dist/site && zip -qr ../nfl-game-day-website.zip .)

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | uv run python -m nfl_book.release_policy "$TAG")"
          prerelease=true
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then prerelease=false; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PDF" "$WEBSITE" "$EPUB" --clobber
            if [ "$latest" = true ]; then gh release edit "$TAG" --latest; fi
          else
            gh release create "$TAG" "$PDF" "$WEBSITE" "$EPUB" --title "$TAG" --notes-file release-notes.md \
              --latest="$latest" --prerelease="$prerelease"
          fi

      - name: Collect earlier website versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _archive
          zip_name="$(basename "$WEBSITE")"
          gh release list --limit 1000 --exclude-drafts --exclude-pre-releases \
              --json tagName --jq '.[].tagName' |
            while read -r tag; do
              if ! gh release view "$tag" --json tagName,publishedAt,assets > "_archive/$tag.json"; then
                echo "::warning::Could not read release $tag; its website version is skipped"
                rm -f "_archive/$tag.json"
                continue
              fi
              if [ "$tag" != "$TAG" ] && jq -e --arg n "$zip_name" 'any(.assets[]; .name == $n)' "_archive/$tag.json" >/dev/null; then
                gh release download "$tag" --pattern "$zip_name" --dir "_archive/$tag" ||
                  echo "::warning::Could not download the website ZIP for $tag"
              fi
            done

      # Every deploy uploads all versions, with the newest stable release at the root.
      # Deploy only when that root is the newest stable tag, so neither a manual rebuild
      # of an older tag nor a missing newest ZIP can put older content at the root.
      - name: Assemble all website versions
        id: pages-gate
        run: |
          newest="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | uv run python -m nfl_book.release_policy --newest)"
          root="$(uv run python -m nfl_book.site_archive --tag "$TAG" --site dist/site \
            --archive _archive --out _pages --pdf "$(basename "$PDF")" --epub "$(basename "$EPUB")")"
          deploy=false
          if [ -n "$root" ] && [ "$root" = "$newest" ]; then
            deploy=true
          else
            echo "::warning::Not deploying Pages: the site root would be '${root:-nothing}', but the newest stable tag is '${newest:-none}'."
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.pages-gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload website for Pages
        if: steps.pages-gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

      - name: Deploy website
        id: deployment
        if: steps.pages-gate.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
