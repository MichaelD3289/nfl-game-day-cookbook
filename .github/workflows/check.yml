name: PR checks

on:
  pull_request:
    branches: [main]
    # ready_for_review starts the PDF build when a draft PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting, lint, test, and validate content
        run: make check

  # The Quarto-rendered tests skip where Quarto is missing, so make check alone never
  # renders a page. This job renders the website and EPUB tests plus the real EPUB,
  # so a rendering problem fails the PR instead of the release. The PDF has its own
  # job below. Dependabot PRs skip it (they only bump GitHub Actions); the push to main
  # after merging still renders.
  render:
    name: Render website and EPUB
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18 # keep in step with release.yml
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Render tests
        run: uv run pytest tests/integration/test_website_build.py tests/integration/test_epub_build.py
      - name: Build the full EPUB
        run: make epub

  # The full PDF needs TinyTeX and takes the longest, so it skips draft PRs: open a PR
  # as a draft while iterating, and this runs once it is marked ready and on every push
  # after that. --strict fails on a recipe that overflows its page. It does not run on
  # pushes to main; the release workflow builds the PDF again before publishing.
  # Dependabot PRs are skipped too, as in render. Run the workflow by hand on such a
  # branch if one needs a PDF check.
  pdf:
    name: Build PDF
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - uses: quarto-dev/quarto-actions/setup@v2
        env:
          # Quarto reads GH_TOKEN when looking up the latest TinyTeX release.
          GH_TOKEN: ${{ github.token }}
        with:
          version: 1.10.18 # keep in step with release.yml
          tinytex: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Render the fixture booklet and card PDF tests
        run: uv run pytest -m pdf
      - name: Build the full PDF, failing on page overflows
        run: uv run nfl-book build --strict
      - name: Build the full recipe cards, failing on side-limit overflows
        run: uv run nfl-book cards --strict
