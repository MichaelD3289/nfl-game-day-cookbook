name: Tag release from main

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize the version comparison and tag creation, including reruns.
concurrency:
  group: cookbook-auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tag a newer package version
        id: tag
        run: python .github/scripts/tag_release.py

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      pages: write
      id-token: write
    # GITHUB_TOKEN tag pushes do not trigger other workflows; call it explicitly.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
